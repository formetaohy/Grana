name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MACOSX_DEPLOYMENT_TARGET: 14.0

jobs:
  version:
    name: Tag & Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Match the tag against the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          versions=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '[.packages[].version] | unique | join(" ")')
          if [ "$versions" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace versions: $versions" >&2
            exit 1
          fi

  check:
    uses: ./.github/workflows/ci.yml
    needs: version

  windows:
    name: Windows Installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p grana --all-features --release --locked

      - name: Import signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'grana.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "GRANA_SIGN_CERTIFICATE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GRANA_SIGN_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: ./installer/windows/build.ps1 -Output dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS Installer
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Apple silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p grana --all-features --release --locked --target aarch64-apple-darwin

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/grana.keychain-db"
          password="actions"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/grana.p12"
          security import "$RUNNER_TEMP/grana.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security find-identity -v -p codesigning "$keychain"
          echo "GRANA_SIGN_IDENTITY=${MACOS_SIGN_IDENTITY:?}" >> "$GITHUB_ENV"
          if [[ -n "$MACOS_NOTARY_KEY" ]]; then
            echo "$MACOS_NOTARY_KEY" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "GRANA_NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "GRANA_NOTARY_KEY_ID=${MACOS_NOTARY_KEY_ID:?}"
              echo "GRANA_NOTARY_ISSUER=${MACOS_NOTARY_ISSUER:?}"
            } >> "$GITHUB_ENV"
          fi

      - name: Build installer
        run: ./installer/macos/build.sh --output dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          (cd dist && sha256sum Grana-* > SHA256SUMS.txt)

      - name: Generate notes
        run: |
          if previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null); then
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
          else
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          fi
          {
            echo "**Full Changelog**: $compare"
            echo
            echo "Windows 11 (64-bit) and macOS 14 or newer on Apple silicon."
            echo
            echo "### Downloads"
            echo
            for installer in dist/Grana-*; do
              printf -- '- %s\n' "$(basename "$installer")"
            done
            echo
            echo "Checksums are listed in SHA256SUMS.txt."
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag dist/*
          fi

