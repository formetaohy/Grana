name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Tag & Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Match the tag against the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          versions=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '[.packages[].version] | unique | join(" ")')
          if [ "$versions" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace versions: $versions" >&2
            exit 1
          fi

  check:
    uses: ./.github/workflows/ci.yml
    needs: version

  windows:
    name: Windows Installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p grana --all-features --release --locked

      - name: Import signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'grana.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "GRANA_SIGN_CERTIFICATE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GRANA_SIGN_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: ./installer/windows/build.ps1 -Output dist

      - name: Build portable distribution
        run: cargo run -p grana-package --release --locked -- dist --binary target/release/grana.exe

      - name: Generate update manifest
        run: cargo run -p grana-package --release --locked -- manifest

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.msi
            dist/*.exe
            dist/*.zip
            dist/latest.toml
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate notes
        run: |
          if previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null); then
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
          else
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          fi
          {
            echo "**Full Changelog**: $compare"
            echo
            echo "Windows 11 (64-bit)."
            echo
            echo "### Downloads"
            echo
            for asset in dist/*-setup.exe dist/*.zip dist/*.msi; do
              echo "- $(basename "$asset")"
            done
            echo
            echo "The zip runs without installation; it updates itself in place. Checksums are listed in latest.toml."
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/*-setup.exe dist/*.zip dist/*.msi dist/latest.toml)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${assets[@]}"
          fi
