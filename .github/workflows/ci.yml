name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Format & Lint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run -p grana --all-features --locked --no-fail-fast

  build:
    name: Release Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --workspace --all-features --release --locked

  installer:
    name: Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build release binary
        run: cargo build -p grana --all-features --release --locked

      - name: Regenerate installer artwork
        run: cargo run -p grana-package --release --locked -- installer

      - name: Verify installer artwork
        run: git diff --exit-code -- installer

      - name: Build installer
        shell: pwsh
        run: ./installer/windows/build.ps1 -Output dist

      - name: Build portable distribution
        run: cargo run -p grana-package --release --locked -- dist --binary target/release/grana.exe

      - name: Generate update manifest
        run: cargo run -p grana-package --release --locked -- manifest

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: |
            dist/*.msi
            dist/*.exe
            dist/*.zip
            dist/latest.toml
          if-no-files-found: error
          retention-days: 7

  check:
    name: Check & Test
    needs: [quality, test, build, installer]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.installer.result }}" = success
