[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
description = "Next-generation microscopy image visualization and analysis platform"
license = "MIT"
repository = "https://github.com/formetaohy/Grana"

[workspace.dependencies]
arboard = { version = "3", default-features = false }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
embed-resource = "3"
glam = { version = "0.30", features = ["bytemuck"] }
half = "2"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "time", "tracing-log"] }
sys-locale = "0.3"
rfd = "0.17"
flate2 = "1"
fs4 = "1"
quick-xml = "0.41"
slotmap = "1"
zarrs = { version = "0.23", default-features = false, features = ["filesystem", "blosc", "zstd", "gzip", "sharding", "crc32c"] }
openh264 = "0.9"
burn = { version = "0.22.1", default-features = false, features = ["std", "wgpu", "cubecl", "pytorch"] }
hdf5-pure = "0.47"
memmap2 = "0.9"
openreadout-core = "0.4"
openreadout-hdf5 = "0.4"
openreadout-jpegxr = "0.4"
openreadout-lif = "0.4"
openreadout-nd2 = "0.4"
openreadout-oir = "0.4"
openreadout-oif = "0.4"
openreadout-vsi = "0.4"
openreadout-zvi = "0.4"
openreadout-em = "0.4"
openreadout-wsi = "0.4"
openreadout-hcs = "0.4"
png = "0.18"
weezl = "0.2"
fax = "0.3"
zune-jpeg = "0.5"
sha2 = "0.10"
semver = "1"
self-replace = "1"
ureq = "3"
windows-sys = "0.61"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.13"
grana-animation = { version = "0.2.3", path = "crates/grana-animation" }
grana-archive = { version = "0.2.3", path = "crates/grana-archive" }
grana-brand = { version = "0.2.3", path = "crates/grana-brand" }
grana-calibration = { version = "0.2.3", path = "crates/grana-calibration" }
grana-chart = { version = "0.2.3", path = "crates/grana-chart" }
grana-volume = { version = "0.2.3", path = "crates/grana-volume" }
grana-object = { version = "0.2.3", path = "crates/grana-object" }
grana-profile = { version = "0.2.3", path = "crates/grana-profile" }
grana-gpu = { version = "0.2.3", path = "crates/grana-gpu" }
grana-figure = { version = "0.2.3", path = "crates/grana-figure" }
grana-engine = { version = "0.2.3", path = "crates/grana-engine" }
grana-i18n = { version = "0.2.3", path = "crates/grana-i18n" }
grana-offline = { version = "0.2.3", path = "crates/grana-offline" }
grana-ome = { version = "0.2.3", path = "crates/grana-ome" }
grana-page = { version = "0.2.3", path = "crates/grana-page" }
grana-report = { version = "0.2.3", path = "crates/grana-report" }
grana-app = { version = "0.2.3", path = "crates/grana-app" }
grana-codec = { version = "0.2.3", path = "crates/grana-codec" }
grana-geometry = { version = "0.2.3", path = "crates/grana-geometry" }
grana-display = { version = "0.2.3", path = "crates/grana-display" }
grana-dir = { version = "0.2.3", path = "crates/grana-dir" }
grana-file = { version = "0.2.3", path = "crates/grana-file" }
grana-log = { version = "0.2.3", path = "crates/grana-log" }
grana-scene = { version = "0.2.3", path = "crates/grana-scene" }
grana-project = { version = "0.2.3", path = "crates/grana-project" }
grana-protocol = { version = "0.2.3", path = "crates/grana-protocol" }
grana-pipeline = { version = "0.2.3", path = "crates/grana-pipeline" }
grana-preview = { version = "0.2.3", path = "crates/grana-preview" }
grana-raster = { version = "0.2.3", path = "crates/grana-raster" }
grana-text = { version = "0.2.3", path = "crates/grana-text" }
grana-vector = { version = "0.2.3", path = "crates/grana-vector" }
grana-ui = { version = "0.2.3", path = "crates/grana-ui" }
grana-editor = { version = "0.2.3", path = "crates/grana-editor" }
grana-exec = { version = "0.2.3", path = "crates/grana-exec" }
grana-analysis = { version = "0.2.3", path = "crates/grana-analysis" }
grana-render = { version = "0.2.3", path = "crates/grana-render" }
grana-zarr = { version = "0.2.3", path = "crates/grana-zarr" }
grana-tiff = { version = "0.2.3", path = "crates/grana-tiff" }
grana-czi = { version = "0.2.3", path = "crates/grana-czi" }
grana-readout = { version = "0.2.3", path = "crates/grana-readout" }
grana-image = { version = "0.2.3", path = "crates/grana-image" }
grana-interop = { version = "0.2.3", path = "crates/grana-interop" }
grana-net = { version = "0.2.3", path = "crates/grana-net" }
grana-measure = { version = "0.2.3", path = "crates/grana-measure" }
grana-mesh = { version = "0.2.3", path = "crates/grana-mesh" }
grana-model = { version = "0.2.3", path = "crates/grana-model" }
grana-optics = { version = "0.2.3", path = "crates/grana-optics" }
grana-restore = { version = "0.2.3", path = "crates/grana-restore" }
grana-segment = { version = "0.2.3", path = "crates/grana-segment" }
grana-session = { version = "0.2.3", path = "crates/grana-session" }
grana-stitch = { version = "0.2.3", path = "crates/grana-stitch" }
grana-store = { version = "0.2.3", path = "crates/grana-store" }
grana-update = { version = "0.2.3", path = "crates/grana-update" }
grana-video = { version = "0.2.3", path = "crates/grana-video" }
grana-weight = { version = "0.2.3", path = "crates/grana-weight" }
grana-warp = { version = "0.2.3", path = "crates/grana-warp" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "grana"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["assets/data"]

[[bin]]
name = "grana"
path = "src/main.rs"

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[dependencies]
grana-app = { workspace = true }
grana-log = { workspace = true }

