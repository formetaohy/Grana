[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
description = "Next-generation microscopy image visualization and analysis platform"
license = "MIT"
repository = "https://github.com/formetaohy/Grana"

[workspace.dependencies]
arboard = { version = "3", default-features = false }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
glam = { version = "0.30", features = ["bytemuck"] }
half = "2"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
flate2 = "1"
fs4 = "1"
quick-xml = "0.41"
slotmap = "1"
zarrs = { version = "0.23", default-features = false, features = ["filesystem", "blosc", "zstd", "gzip", "sharding", "crc32c"] }
ome_zarr_metadata = "0.3"
openh264 = "0.9"
openreadout-core = "0.4"
openreadout-jpegxr = "0.4"
openreadout-lif = "0.4"
openreadout-nd2 = "0.4"
png = "0.18"
zstd = "0.13"
grana-animation = { version = "0.1.1", path = "crates/grana-animation" }
grana-volume = { version = "0.1.1", path = "crates/grana-volume" }
grana-object = { version = "0.1.1", path = "crates/grana-object" }
grana-gpu = { version = "0.1.1", path = "crates/grana-gpu" }
grana-figure = { version = "0.1.1", path = "crates/grana-figure" }
grana-glass = { version = "0.1.1", path = "crates/grana-glass" }
grana-engine = { version = "0.1.1", path = "crates/grana-engine" }
grana-app = { version = "0.1.1", path = "crates/grana-app" }
grana-codec = { version = "0.1.1", path = "crates/grana-codec" }
grana-geometry = { version = "0.1.1", path = "crates/grana-geometry" }
grana-display = { version = "0.1.1", path = "crates/grana-display" }
grana-scene = { version = "0.1.1", path = "crates/grana-scene" }
grana-project = { version = "0.1.1", path = "crates/grana-project" }
grana-protocol = { version = "0.1.1", path = "crates/grana-protocol" }
grana-pipeline = { version = "0.1.1", path = "crates/grana-pipeline" }
grana-raster = { version = "0.1.1", path = "crates/grana-raster" }
grana-text = { version = "0.1.1", path = "crates/grana-text" }
grana-ui = { version = "0.1.1", path = "crates/grana-ui" }
grana-editor = { version = "0.1.1", path = "crates/grana-editor" }
grana-analysis = { version = "0.1.1", path = "crates/grana-analysis" }
grana-render = { version = "0.1.1", path = "crates/grana-render" }
grana-zarr = { version = "0.1.1", path = "crates/grana-zarr" }
grana-tiff = { version = "0.1.1", path = "crates/grana-tiff" }
grana-czi = { version = "0.1.1", path = "crates/grana-czi" }
grana-readout = { version = "0.1.1", path = "crates/grana-readout" }
grana-image = { version = "0.1.1", path = "crates/grana-image" }
grana-measure = { version = "0.1.1", path = "crates/grana-measure" }
grana-obj = { version = "0.1.1", path = "crates/grana-obj" }
grana-session = { version = "0.1.1", path = "crates/grana-session" }
grana-video = { version = "0.1.1", path = "crates/grana-video" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "grana"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "grana"
path = "src/main.rs"

[dependencies]
grana-app = { workspace = true }

[lints]
workspace = true

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
